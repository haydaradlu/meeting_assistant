version: '3.8'

services:
  # ============================================
  # PostgreSQL Database Service
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: meeting_assistant_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin1212}
      POSTGRES_DB: ${POSTGRES_DB:-meeting_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - meeting_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-meeting_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # FastAPI Backend Service
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meeting_assistant_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin1212}@db:5432/${POSTGRES_DB:-meeting_assistant}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-id}
      SUMMARY_PERCENTAGE: ${SUMMARY_PERCENTAGE:-60}
      UPLOAD_DIR: uploads
      HF_HOME: /root/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /root/.cache/sentence_transformers
    volumes:
      - ./backend/uploads:/app/uploads
      - model_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - meeting_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3

# ============================================
# Persistent Docker Volumes & Networks
# ============================================
volumes:
  postgres_data:
    driver: local
  model_cache:
    driver: local

networks:
  meeting_net:
    driver: bridge
